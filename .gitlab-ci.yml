# This is the CI/CD pipeline for the repository mirror in Gitlab.

stages:
  - pre-commit
  - initialisation
  - build
  - test

variables:
  NO_LBLOGIN: "1"
  GIT_SUBMODULE_STRATEGY: none
  CHARM_BRANCH: main

check-formatting:
  stage: pre-commit
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    paths:
      - ${PRE_COMMIT_HOME}
  before_script:
    - |
      python3 -m venv ${CI_PROJECT_DIR}/.cache/pre-commit-venv
      source ${CI_PROJECT_DIR}/.cache/pre-commit-venv/bin/activate
      pip install --upgrade pip
      pip install -U pre-commit
      pip install six
  script:
    - pre-commit run --all-files --show-diff-on-failure

charm-init:
  stage: initialisation
  tags:
    - cvmfs
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  script:
    - |
      echo "Initialise charm-fitter repository..."
      git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cern.ch/gammacombo/charm.git charm-fitter
      cd charm-fitter
      git fetch origin
      echo "Checking out branch ${CHARM_BRANCH}..."
      git checkout $CHARM_BRANCH --
      git pull origin $CHARM_BRANCH
      cd ..
      source scripts/setup-env-cvmfs.sh -c || exit 1
  artifacts:
    when: on_success
    untracked: true
    paths:
      - charm-fitter
    access: all
    expire_in: 1 days

build_gcc:
  tags:
    - cvmfs
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  before_script:
    - source scripts/setup-env-cvmfs.sh || exit 1
  stage: build
  dependencies:
    - charm-init
  script:
    - |
      cmake -B build
      cmake --build build
      cmake --install build

.select_runner:
  tags:
    - cvmfs
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  before_script:
    - source scripts/setup-env-cvmfs.sh -c || exit 1

build_clang:
  extends: .select_runner
  stage: build
  dependencies:
    - charm-init
  script:
    - |
      cmake -B build
      cmake --build build
      cmake --install build
  artifacts:
    when: on_success
    untracked: true
    paths:
      - build
      - tutorial
      - charm-fitter
    access: all
    expire_in: 1 days

.test:
  extends: .select_runner
  stage: test
  dependencies:
    - build_clang

test-tutorial:
  extends: .test
  stage: test
  script:
    - python scripts/run_ci_tests.py
  artifacts:
    when: always
    paths:
      - tutorial/ci_logs
      - tutorial/plots
      - tutorial/root
      - tutorial/workspace.root
    expire_in: 1 days

test-charm:
  extends: .test
  stage: test
  dependencies:
    - build_clang
  tags:
    - cvmfs
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  before_script:
    - |
      source scripts/setup-env-cvmfs.sh -c || exit 1
      python -m venv venvs/charm
      source venvs/charm/bin/activate
      python -m pip install --upgrade pip
      python -m pip install -e . -e charm-fitter
      cd charm-fitter
  script:
    - python scripts/BLUE/python/dy.py -c wa-2024 --fs all
    - python scripts/BLUE/python/d-to-etah.py -c 2025
    - python scripts/BLUE/python/d0-to-ksks.py -c 2025
    - python scripts/mpl-plots.py -a 1d --config config/plotting/2025.py --rescan --no-latex
  artifacts:
    when: always
    paths:
      - charm-fitter/plots/BLUE
      - charm-fitter/plots/matplotlib
      - charm-fitter/plots/par
      - charm-fitter/plots/scanner
    expire_in: 1 days
