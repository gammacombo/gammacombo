# This is the CI/CD pipeline for the repository mirror in Gitlab.

stages:
  - pre-commit
  - build
  - test

variables:
  NO_LBLOGIN: "1"

check-formatting:
  stage: pre-commit
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    paths:
      - ${PRE_COMMIT_HOME}
  before_script:
    - |
      python3 -m venv ${CI_PROJECT_DIR}/.cache/pre-commit-venv
      source ${CI_PROJECT_DIR}/.cache/pre-commit-venv/bin/activate
      pip install --upgrade pip
      pip install -U pre-commit
      pip install six
  script:
    - pre-commit run --all-files --show-diff-on-failure

build_gcc:
  tags:
    - cvmfs
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  before_script:
    - source scripts/setup-env-cvmfs.sh || exit 1
  stage: build
  script:
    - |
      cmake -B build
      cmake --build build
      cmake --install build

.select_runner:
  tags:
    - cvmfs
  image: gitlab-registry.cern.ch/lhcb-docker/os-base/alma9-devel:latest
  before_script:
    - source scripts/setup-env-cvmfs.sh -c || exit 1

build_clang:
  extends: .select_runner
  stage: build
  script:
    - |
      cmake -B build
      cmake --build build
      cmake --install build
  artifacts:
    when: on_success
    untracked: true
    paths:
      - build
      - tutorial
    access: all
    expire_in: 1 days

.test:
  extends: .select_runner
  stage: test
  dependencies:
    - build_clang

test-tutorial:
  extends: .test
  stage: test
  script:
    - python scripts/run_ci_tests.py
  artifacts:
    when: always
    paths:
      - tutorial/ci_logs
      - tutorial/plots
      - tutorial/root
      - tutorial/workspace.root
    expire_in: 1 days

# Template for jobs needing the gc_core Python package (and, through EXTRA_PIP_PACKAGES, e.g. the
# Python package of a combiner module, such as "-e <module-dir>").
.python_venv:
  extends: .test
  variables:
    EXTRA_PIP_PACKAGES: ""
  before_script:
    - |
      source scripts/setup-env-cvmfs.sh -c || exit 1
      python -m venv --system-site-packages venvs/gc
      source venvs/gc/bin/activate
      python -m pip install --upgrade pip
      python -m pip install -e . ${EXTRA_PIP_PACKAGES}

test-python:
  extends: .python_venv
  stage: test
  script:
    - python -c "import gc_core.mpl_tools, gc_core.pyfitres, gc_core.utils; gc_core.utils.load_gc_core_lib()"
